<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" data-i18n-content="Logic puzzle games. Every puzzle has a unique solution you can reach without guessing." content="Logic puzzle games. Every puzzle has a unique solution you can reach without guessing." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Puzzles" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Logic Puzzles</title>
  </head>
  <body>
    <section id="menu-screen" class="screen" hidden>
      <header class="topbar">
        <h1 data-i18n="Logic Puzzles">Logic Puzzles</h1>
        <button id="rules-btn" type="button" class="icon-circle" data-i18n-label="Rules" aria-label="Rules">?</button>
        <div id="lang-select" class="lang-select" role="group" data-i18n-label="Language" aria-label="Language"></div>
      </header>
      <main class="menu">
        <div id="game-list" class="cards"></div>
        <p class="menu-note" data-i18n="Endless puzzles, each with one solution you can reach by logic alone.">Endless puzzles, each with one solution you can reach by logic alone.</p>
        <button id="install-btn" type="button" class="wide install-btn" data-i18n="Install app" hidden>Install app</button>
        <footer class="about">
          <h2 data-i18n="Share with friends">Share with friends</h2>
          <button id="share-btn" type="button" class="wide" data-i18n="Share this game">Share this game</button>
          <p class="menu-note">
            <span data-i18n="Free and open source.">Free and open source.</span>
            <a href="https://github.com/acroca/pwagames" target="_blank" rel="noopener" data-i18n="View the code on GitHub">View the code on GitHub</a>
          </p>
          <p class="menu-note" data-i18n="Contributions, bug reports and ideas are welcome.">Contributions, bug reports and ideas are welcome.</p>
        </footer>
      </main>
    </section>

    <section id="game-screen" class="screen" hidden>
      <header class="topbar">
        <button id="back" type="button" class="icon-btn" data-i18n-label="All games" aria-label="All games">‹</button>
        <div class="title">
          <h1 id="game-title"></h1>
          <span class="meta"><span id="game-meta"></span> <span id="timer" class="timer" role="timer"></span></span>
        </div>
        <button id="game-rules" type="button" class="icon-circle" data-i18n-label="Rules" aria-label="Rules">?</button>
        <nav class="actions">
          <button id="undo" type="button" data-i18n="Undo">Undo</button>
          <button id="check" type="button" data-i18n="Check">Check</button>
          <button id="more" type="button" class="primary" data-i18n="New">New</button>
        </nav>
      </header>
      <main class="play">
        <div id="board-wrap" class="board-wrap">
          <div id="loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span><span data-i18n="Creating puzzle…">Creating puzzle…</span></div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </main>
      <footer id="toolbar" class="toolbar"></footer>
    </section>

    <dialog id="sheet" class="sheet"></dialog>
    <dialog id="install-sheet" class="sheet"></dialog>
    <dialog id="guide" class="sheet"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
